name: build

on: [push, pull_request]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller package/build.spec

      - name: Windows Package
        if: matrix.os == 'windows-2022'
        run: |
          $line = Select-String -Path src\config.py -Pattern 'KRAIT_VERSION =' | Out-String
          $version = $line.Split('"')[1]
          iscc /DMyAppVersion=$version package/build_win_installer.iss
          cd dist
          7z a Krait-v$version-win64.7z Krait

      - name: Linux Package
        if: matrix.os == 'ubuntu-22.04'
        run: |
          version=`awk '/^KRAIT_VERSION/{print $NF}' src/config.py | sed 's/\"//g'`
          chmod +x package/build_linux_desktop.sh
          package/build_linux_desktop.sh $version

      - name: MacOS ARM Package
        if: matrix.os == 'macos-15'
        run: |
          version=`awk '/^KRAIT_VERSION/{print $NF}' src/config.py | sed 's/\"//g'`
          chmod +x package/build_mac_installer.sh
          package/build_mac_installer.sh $version arm64

      - name: MacOS X64 Package
        if: matrix.os == 'macos-15-intel'
        run: |
          version=`awk '/^KRAIT_VERSION/{print $NF}' src/config.py | sed 's/\"//g'`
          chmod +x package/build_mac_installer.sh
          package/build_mac_installer.sh $version x64

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.7z
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.7z
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg
